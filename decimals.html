<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decimals | The Math Lab</title><style>body{margin:0;background:#edf3fb;color:#172b46;font-family:system-ui,Arial}main{max-width:820px;margin:36px auto;padding:20px}header{text-align:center}h1{color:#1654a4}section{background:#fff;padding:25px;border-radius:17px;margin:20px 0;box-shadow:0 7px 22px #18365b16}select,input{font:inherit;padding:12px;border:1px solid #b7c9df;border-radius:8px;width:100%;box-sizing:border-box}button,.btn{background:#1757a7;color:white;border:0;border-radius:9px;padding:12px 18px;margin:14px 8px 0 0;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}.hide{display:none}#question{font-size:1.4rem;font-weight:700;margin:20px 0}#feedback{padding:12px;border-radius:8px;background:#f0f6ff;white-space:pre-line}.muted{color:#53647b}label{display:block;font-weight:700;margin:12px 0 7px}</style></head><body><main><header><h1>🧪 The Math Lab</h1><p>Understanding Decimals · Math 126</p><a href="index.html">← Fractions Challenge</a></header><section id="setup"><h2>Decimals Challenge</h2><p>Choose a topic. Read the explanation, then solve 10 questions. Answers and explanations appear after each attempt.</p><label for="topic">Choose a section</label><select id="topic"><option value="convert">Decimals and Fractions</option><option value="place">Place Value and Reading</option><option value="expand">Composing and Decomposing</option><option value="model">Decimal Models and Number Lines</option><option value="compare">Comparing and Ordering</option><option value="round">Rounding and Approximation</option><option value="apply">Applications and Reasoning</option></select><button id="start">Start Challenge</button></section><section id="game" class="hide"><p id="progress"></p><p id="score"></p><h2 id="title"></h2><p id="lesson" class="muted"></p><div id="question"></div><label for="answer">Your answer</label><input id="answer" autocomplete="off"><button id="check">Check Answer</button><button id="next" class="hide">Next Question</button><p id="feedback" role="status"></p></section><section id="result" class="hide"><h2>Challenge complete!</h2><p id="summary"></p><button id="again">Choose another topic</button></section></main><script>
const $=id=>document.getElementById(id),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const topics={
convert:["Decimals and Fractions","A decimal represents parts of a whole. Tenths have denominator 10; hundredths, 100; thousandths, 1000. Example: 0.37 = 37/100."],
place:["Place Value and Reading","The first three positions after the decimal point are tenths, hundredths and thousandths. Example: in 4.275, the digit 7 is in the hundredths place."],
expand:["Composing and Decomposing","Break decimals into place-value parts. Example: 3.49 = 3 + 0.4 + 0.09."],
model:["Decimal Models and Number Lines","A 10 × 10 grid contains 100 cells. Each cell is 0.01. On a number line, the midpoint of 1.2 and 1.3 is 1.25."],
compare:["Comparing and Ordering","Align decimal points and compare digits from left to right. Trailing zeros do not change the value: 0.7 = 0.70."],
round:["Rounding and Approximation","Find the requested place and inspect the next digit. If it is 5 or greater, round up; otherwise keep the digit. Example: 6.354 rounded to hundredths is 6.35."],
apply:["Applications and Reasoning","Use decimals for money, measurements and scores. Example: 4 inner hits worth 0.1 each earn 0.4 points."]
};
function fixed(n,k){return n.toFixed(k)}function frac(n,d){let g=(a,b)=>b?g(b,a%b):a;let x=g(n,d);return n/x+"/"+d/x}
function problem(t){let a=R(1,9),b=R(1,9),c=R(1,9),n,d,v,p;
if(t==="convert"){d=[10,100,1000][R(0,2)];n=R(1,d-1);if(R(0,1))return {q:"Write "+n+"/"+d+" as a decimal.",a:String(n/d),why:"Divide "+n+" by "+d+"."};return {q:"Write "+(n/d)+" as a fraction in simplest form (use a/b).",a:frac(n,d),why:"The denominator is "+d+" before simplifying."}}
if(t==="place"){let digits=[a,b,c];let idx=R(0,2);return {q:"In "+R(1,9)+"."+digits.join("")+", what is the value of the "+["tenths","hundredths","thousandths"][idx]+" digit? (Give a decimal.)",a:String(digits[idx]/10**(idx+1)),why:"The digit "+digits[idx]+" occupies the "+["tenths","hundredths","thousandths"][idx]+" place."}}
if(t==="expand"){n=R(1,9);if(R(0,1))return {q:"Compose: "+n+" + 0."+a+" + 0.0"+b+" (give one decimal).",a:String(n+a/10+b/100),why:"Add ones, tenths, then hundredths."};return {q:"What is the hundredths contribution in "+n+"."+a+b+c+"? (Give a decimal.)",a:String(b/100),why:"The second digit after the point represents hundredths."}}
if(t==="model"){n=R(1,99);if(R(0,1))return {q:"A 100-cell grid has "+n+" shaded cells. What decimal is shaded?",a:String(n/100),why:"Each cell is one hundredth, so divide by 100."};n=R(1,8);return {q:"What is the midpoint between "+fixed(n/10,1)+" and "+fixed((n+1)/10,1)+"?",a:String((2*n+1)/20),why:"The midpoint is halfway between the endpoints."}}
if(t==="compare"){n=R(1,99);d=R(1,99);return {q:"Compare "+fixed(n/100,2)+" and "+fixed(d/100,2)+". Enter <, > or =.",a:n<d?"<":n>d?">":"=",why:"Compare the hundredths as whole-number counts after aligning decimal places."}}
if(t==="round"){p=R(0,2);n=R(1000,99999);v=n/1000;let pow=10**p;let answer=Math.round((n/1000)*pow+1e-9)/pow;return {q:"Round "+fixed(v,3)+" to the nearest "+["whole number","tenth","hundredth"][p]+".",a:fixed(answer,p),why:"Look at the digit immediately to the right of the rounding place."}}
if(t==="apply"){n=R(1,9);d=R(1,9);c=R(1,9);return {q:"A game awards 0.1 point per inner hit, 0.01 per middle hit and 0.001 per outer hit. Find the score for "+n+" inner, "+d+" middle and "+c+" outer hits.",a:fixed(n/10+d/100+c/1000,3),why:n+" × 0.1 + "+d+" × 0.01 + "+c+" × 0.001 = "+fixed(n/10+d/100+c/1000,3)}}
}
let set=[],i=0,score=0,locked=false;
function view(x){["setup","game","result"].forEach(k=>$(k).classList.toggle("hide",k!==x))}
function draw(){locked=false;$("progress").textContent="Question "+(i+1)+" of 10";$("score").textContent="Score: "+score;$("question").textContent=set[i].q;$("answer").value="";$("answer").disabled=false;$("feedback").textContent="";$("check").classList.remove("hide");$("next").classList.add("hide");$("answer").focus()}
$("start").onclick=()=>{let t=$("topic").value;set=Array.from({length:10},()=>problem(t));i=score=0;$("title").textContent=topics[t][0];$("lesson").textContent=topics[t][1];view("game");draw()};
$("check").onclick=()=>{if(locked)return;let typed=$("answer").value.trim(),correct=set[i].a;let ok=(typed===correct)||(/^-?\d+(\.\d+)?$/.test(typed)&&/^-?\d+(\.\d+)?$/.test(correct)&&Math.abs(Number(typed)-Number(correct))<1e-9);if(!typed){$("feedback").textContent="Please enter an answer.";return}locked=true;if(ok)score++;$("score").textContent="Score: "+score;$("feedback").textContent=(ok?"✓ Correct!":"Not quite. Answer: "+correct)+"\n"+set[i].why;$("answer").disabled=true;$("check").classList.add("hide");$("next").classList.remove("hide");$("next").textContent=i===9?"See Results":"Next Question"};
$("next").onclick=()=>{i++;if(i===10){$("summary").textContent="You scored "+score+" out of 10 ("+(score*10)+"%).";view("result")}else draw()};$("again").onclick=()=>view("setup");$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")$(locked?"next":"check").click()});
</script></body></html>
